<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<script src="https://cdn.jsdelivr.net/npm/json5@2.2.3/dist/index.min.js"></script>

<link rel="icon" href="assets/favicon.png">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
body{background:#f6f7f9;color:#111}
.hidden{display:none !important}

.header{background:#fff;padding:16px;position:sticky;top:0;z-index:1000;border-bottom:1px solid #eee}
.header-top{display:flex;align-items:center;justify-content:space-between}
.restaurant-info{display:flex;align-items:center;gap:12px}
#restaurantLogo{width:56px;height:56px;border-radius:12px;object-fit:cover}
#restaurantName{font-size:20px;font-weight:800}
#liveStatus{font-size:13px;font-weight:600;margin-top:4px}

.search-bar{margin-top:12px;display:flex;gap:10px}
#searchInput{flex:1;padding:12px;border-radius:12px;border:1px solid #ddd}
#vegToggle{padding:12px 16px;border-radius:12px;border:none;font-weight:700;cursor:pointer;background:#eee}

.category-nav{position:sticky;top:120px;background:#fff;display:flex;gap:16px;overflow-x:auto;padding:12px;border-bottom:1px solid #eee;z-index:999}
.category-nav button{background:none;border:none;font-weight:600;cursor:pointer;white-space:nowrap}

.menu-section{padding:16px}
.category-title{font-size:18px;font-weight:800;margin-bottom:12px}
.menu-item{background:#fff;padding:12px;border-radius:14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,0.05)}
.menu-item-header{display:flex;justify-content:space-between}
.item-name{font-weight:700}
.item-desc{font-size:12px;color:#666;margin-top:4px}

.cart-bar{position:fixed;bottom:12px;left:12px;right:12px;background:#111;color:#fff;padding:14px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;z-index:2000}
.cart-bar.hidden{display:none}

.footer{text-align:center;padding:20px;font-size:13px;color:#777}
</style>
</head>

<body>

<div class="header">
  <div class="header-top">
    <div class="restaurant-info">
      <img id="restaurantLogo">
      <div>
        <div id="restaurantName"></div>
        <div id="liveStatus"></div>
      </div>
    </div>
  </div>

  <div class="search-bar" id="searchBar">
    <input type="text" id="searchInput" placeholder="Search dishes...">
    <button id="vegToggle">Veg Mode OFF</button>
  </div>
</div>

<div class="category-nav" id="categoryNav"></div>
<div id="menuContainer"></div>

<div class="cart-bar hidden" id="cartBar">
  <div><span id="cartCount">0</span> items</div>
  <div>₹ <span id="cartTotal">0</span></div>
</div>

<div class="footer">Powered by QR Menu System</div>

<script src="app.js"></script>

</body>
</html>
