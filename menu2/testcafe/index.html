<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Dynamic Title -->
<title>Loading...</title>

<link rel="icon" href="./assets/images/favicon.png">

<!-- JSON5 CDN -->
<script src="https://cdn.jsdelivr.net/npm/json5@2.2.3/dist/index.min.js"></script>

<style>

/* =====================================================
   GLOBAL RESET
===================================================== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
}

body{
  background:#f6f6f6;
  color:#111;
}

/* =====================================================
   HEADER
===================================================== */
.header{
  background:#fff;
  padding:18px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-top{
  display:flex;
  align-items:center;
  gap:14px;
}

#restaurantLogo{
  width:60px;
  height:60px;
  object-fit:contain;
  border-radius:12px;
  background:#fafafa;
  padding:4px;
}

.header-info{
  flex:1;
}

#restaurantName{
  font-size:20px;
  font-weight:800;
}

#liveStatus{
  font-size:13px;
  margin-top:4px;
  display:flex;
  align-items:center;
  gap:6px;
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#16a34a;
  animation:blink 1.2s infinite;
}

@keyframes blink{
  0%{opacity:1}
  50%{opacity:.3}
  100%{opacity:1}
}

#categoryLine{
  font-size:13px;
  color:#666;
  margin-top:4px;
}

/* =====================================================
   SERVICES
===================================================== */
.service-row{
  display:flex;
  gap:10px;
  margin-top:10px;
  flex-wrap:wrap;
}

.service-badge{
  background:#f1f1f1;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

/* =====================================================
   PLATFORM SECTION
===================================================== */
.platform-section{
  background:#fff;
  padding:16px;
  margin-top:8px;
}

.platform-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;
}

.platform-btn{
  padding:12px;
  text-align:center;
  border-radius:12px;
  font-weight:700;
  color:#fff;
}

.zomato{background:#e23744}
.swiggy{background:#fc8019}
.eatsure{background:#3b82f6}
.ubereats{background:#111}

/* =====================================================
   SOCIAL ICONS
===================================================== */
.social-section{
  background:#fff;
  padding:16px;
  margin-top:8px;
  display:flex;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
}

.social-section a img{
  width:22px;
}

/* =====================================================
   GOOGLE REVIEW BUTTON
===================================================== */
#googleReviewSection{
  padding:16px;
  background:#fff;
  margin-top:8px;
  text-align:center;
}

.google-review-btn{
  background:#4285F4;
  color:#fff;
  padding:12px 20px;
  border-radius:10px;
  font-weight:700;
  display:inline-block;
}

/* =====================================================
   SEARCH + FILTER
===================================================== */
.menu-controls{
  background:#fff;
  padding:14px;
  margin-top:8px;
}

#searchInput{
  width:100%;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:14px;
}

.filter-row{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.filter-btn{
  padding:6px 12px;
  border-radius:999px;
  border:1px solid #ccc;
  font-size:12px;
  cursor:pointer;
}

/* =====================================================
   CATEGORY NAV
===================================================== */
.category-nav{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:12px;
  background:#fff;
  position:sticky;
  top:88px;
  z-index:900;
  border-bottom:1px solid #eee;
}

.category-nav button{
  white-space:nowrap;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid #ddd;
  background:#fafafa;
  cursor:pointer;
  font-size:13px;
}

/* =====================================================
   MENU
===================================================== */
.menu-wrapper{
  padding:14px;
}

.menu-category{
  margin-bottom:26px;
}

.category-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:10px;
}

.menu-item{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.item-name{
  font-size:15px;
  font-weight:700;
}

.item-price{
  font-size:14px;
  margin-top:2px;
  color:#555;
}

/* =====================================================
   CART BAR
===================================================== */
#cartBar{
  position:fixed;
  bottom:14px;
  left:14px;
  right:14px;
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:9999;
}

#cartBar.hidden{
  display:none;
}

.cart-btn{
  background:#fc8019;
  color:#fff;
  padding:10px 16px;
  border:none;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}

/* =====================================================
   MODAL BASE
===================================================== */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:10000;
}

.modal.hidden{
  display:none;
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:520px;
  height:80vh;
  border-radius:18px 18px 0 0;
  padding:16px;
  display:flex;
  flex-direction:column;
}

/* =====================================================
   PAYMENT SECTION
===================================================== */
.payment-section{
  background:#fff;
  padding:16px;
  margin-top:8px;
  text-align:center;
}

#paymentQR{
  width:180px;
  height:180px;
  object-fit:contain;
  margin:12px auto;
}

#upiPayBtn{
  background:#16a34a;
  color:#fff;
  padding:10px 18px;
  border-radius:10px;
  font-weight:700;
  margin-top:10px;
  display:inline-block;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="header-top">
    <img id="restaurantLogo">
    <div class="header-info">
      <div id="restaurantName"></div>
      <div id="liveStatus"></div>
      <div id="categoryLine"></div>
      <div class="service-row" id="serviceRow"></div>
    </div>
  </div>
</header>

<!-- PLATFORMS -->
<section class="platform-section" id="platformSection"></section>

<!-- SOCIAL -->
<section class="social-section" id="socialSection"></section>

<!-- GOOGLE REVIEW -->
<section id="googleReviewSection"></section>

<!-- SEARCH -->
<section class="menu-controls">
  <input id="searchInput" placeholder="Search dishes...">
  <div class="filter-row">
    <button class="filter-btn" id="vegFilterBtn">Veg Only</button>
  </div>
</section>

<!-- CATEGORY NAV -->
<div class="category-nav" id="categoryNav"></div>

<!-- MENU -->
<main class="menu-wrapper" id="menuContainer"></main>

<!-- PAYMENT -->
<section class="payment-section" id="paymentSection"></section>

<!-- CART BAR -->
<div id="cartBar" class="hidden">
  <div>
    <strong><span id="cartCount">0</span> Items</strong>
  </div>
  <button class="cart-btn" onclick="openCart()">View Cart</button>
</div>

<!-- CART MODAL -->
<div id="cartModal" class="modal hidden">
  <div class="modal-box">
    <h3>Your Cart</h3>
    <div id="cartItems" style="flex:1;overflow-y:auto;margin-top:10px;"></div>
    <div style="margin-top:10px;">
      Total: ₹ <span id="cartTotal">0</span>
    </div>
    <div style="margin-top:12px;display:flex;gap:10px;">
      <button onclick="clearCart()">Clear Cart</button>
      <button class="cart-btn" onclick="openCheckout()">Checkout</button>
    </div>
  </div>
</div>

<script src="./app.js"></script>

</body>
</html>
