<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Rupali ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            color: #fff;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff0844, #ff6b9d, #c71f37, #ff4081);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: -2;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.1), transparent 70%);
            z-index: -1;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .name-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .main-name {
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8),
                         0 0 40px rgba(255, 105, 180, 0.6),
                         0 0 60px rgba(255, 20, 147, 0.4);
            animation: glow 2s ease-in-out infinite alternate;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInName 1s ease forwards, glow 2s ease-in-out infinite alternate;
        }

        @keyframes fadeInName {
            to { opacity: 1; }
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(255, 105, 180, 0.6); }
            to { text-shadow: 0 0 30px rgba(255, 255, 255, 1), 0 0 60px rgba(255, 105, 180, 0.9); }
        }

        .love-line {
            font-size: 1.5rem;
            margin: 15px 0;
            opacity: 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .love-line.active {
            animation: typewriter 2s steps(40) forwards, fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes typewriter {
            from { width: 0; }
            to { width: 100%; }
        }

        .poem-section {
            text-align: center;
            margin: 40px 0;
            max-width: 600px;
            opacity: 0;
        }

        .poem-section.show {
            animation: slideUp 1s ease forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .poem-line {
            font-size: 1.3rem;
            margin: 15px 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
            opacity: 0;
        }

        .poem-line.show {
            animation: fadeInUp 1s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
            from {
                opacity: 0;
                transform: translateY(20px);
            }
        }

        .button-section {
            margin: 40px 0;
            opacity: 0;
        }

        .button-section.show {
            animation: fadeIn 1s ease forwards;
        }

        .love-button {
            background: linear-gradient(135deg, #ff6b9d, #ff0844);
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 8, 68, 0.4);
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .love-button:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(255, 8, 68, 0.6);
        }

        .proposal-section {
            text-align: center;
            margin-top: 50px;
            opacity: 0;
            display: none;
        }

        .proposal-section.show {
            display: block;
            animation: zoomIn 0.8s ease forwards;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .proposal-text {
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }

        .proposal-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .yes-button, .no-button {
            padding: 15px 40px;
            font-size: 1.3rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .yes-button {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #fff;
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.4);
        }

        .yes-button:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 35px rgba(0, 255, 136, 0.6);
        }

        .no-button {
            background: linear-gradient(135deg, #ff6b6b, #ff4444);
            color: #fff;
            box-shadow: 0 8px 25px rgba(255, 68, 68, 0.4);
            position: relative;
        }

        .final-message {
            text-align: center;
            margin-top: 50px;
            opacity: 0;
            display: none;
        }

        .final-message.show {
            display: block;
            animation: explosionEntry 1s ease forwards;
        }

        @keyframes explosionEntry {
            from {
                opacity: 0;
                transform: scale(0) rotate(-180deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .final-text {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.9),
                         0 0 60px rgba(255, 105, 180, 0.7);
            line-height: 1.6;
        }

        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 255, 255, 0.95);
            color: #ff0844;
            padding: 30px 50px;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            text-align: center;
        }

        .popup.show {
            animation: popupShow 0.5s ease forwards;
        }

        @keyframes popupShow {
            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @media (max-width: 768px) {
            .main-name {
                font-size: 2.5rem;
            }
            .love-line {
                font-size: 1.2rem;
            }
            .poem-line {
                font-size: 1.1rem;
            }
            .proposal-text {
                font-size: 1.5rem;
            }
            .final-text {
                font-size: 1.8rem;
            }
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="glow-overlay"></div>
    <div id="particles-js"></div>

    <div class="container">
        <div class="name-section">
            <div class="main-name">Rupali ❤️</div>
            <div id="love-lines"></div>
        </div>

        <div class="poem-section" id="poem">
            <div class="poem-line">Shaadi abhi nahi hui,</div>
            <div class="poem-line">Par dil se tum meri wife ho 💖</div>
            <div class="poem-line">Tum meri zindagi ho,</div>
            <div class="poem-line">Aur meri har smile ki wajah bhi 😘</div>
        </div>

        <div class="button-section" id="buttonSection">
            <button class="love-button" id="loveBtn">Click here if you love me ❤️</button>
        </div>

        <div class="proposal-section" id="proposal">
            <div class="proposal-text">Do you want to marry me? 💍</div>
            <div class="proposal-buttons">
                <button class="yes-button" id="yesBtn">YES 💖</button>
                <button class="no-button" id="noBtn">NO 🙈</button>
            </div>
        </div>

        <div class="final-message" id="finalMessage">
            <div class="final-text">
                Yayyyy!!! 💍💖<br>
                Rupali officially meri forever Valentine ho 💕
            </div>
        </div>
    </div>

    <div class="popup" id="popup">Ladki ki 'No' me bhi 'Yes' hota hai 😌💖</div>

    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/audio/2022/03/10/audio_2c95fa5fa6.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        particlesJS('particles-js', {
            particles: {
                number: { value: 80, density: { enable: true, value_area: 800 } },
                color: { value: '#ffffff' },
                shape: { type: 'heart' },
                opacity: { value: 0.6, random: true },
                size: { value: 10, random: true },
                line_linked: { enable: false },
                move: {
                    enable: true,
                    speed: 2,
                    direction: 'top',
                    random: true,
                    straight: false,
                    out_mode: 'out'
                }
            },
            retina_detect: true
        });

        const loveMessages = [
            "Main tumse prem karta hoon ❤️",
            "I love you ❤️",
            "Je t'aime ❤️",
            "Te amo ❤️",
            "Ich liebe dich ❤️",
            "Wo ai ni ❤️",
            "Watashi wa anata o aishiteimasu ❤️"
        ];

        const loveLines = document.getElementById('love-lines');
        let currentLine = 0;

        function showNextLine() {
            if (currentLine < loveMessages.length) {
                const div = document.createElement('div');
                div.className = 'love-line';
                div.textContent = loveMessages[currentLine];
                loveLines.appendChild(div);
                
                setTimeout(() => {
                    div.classList.add('active');
                }, 100);

                currentLine++;
                setTimeout(showNextLine, 2500);
            } else {
                setTimeout(showPoem, 1000);
            }
        }

        function showPoem() {
            const poem = document.getElementById('poem');
            poem.classList.add('show');
            
            const lines = poem.querySelectorAll('.poem-line');
            lines.forEach((line, index) => {
                setTimeout(() => {
                    line.classList.add('show');
                }, index * 800);
            });

            setTimeout(() => {
                document.getElementById('buttonSection').classList.add('show');
            }, lines.length * 800 + 500);
        }

        setTimeout(showNextLine, 2000);

        function createFireworks() {
            const duration = 3000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                confetti({
                    ...defaults,
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                });
                confetti({
                    ...defaults,
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                });
            }, 250);
        }

        document.getElementById('loveBtn').addEventListener('click', function() {
            createFireworks();
            document.getElementById('bgMusic').play();
            
            particlesJS('particles-js', {
                particles: {
                    number: { value: 150, density: { enable: true, value_area: 800 } },
                    color: { value: '#ffffff' },
                    shape: { type: 'heart' },
                    opacity: { value: 0.8, random: true },
                    size: { value: 15, random: true },
                    line_linked: { enable: false },
                    move: {
                        enable: true,
                        speed: 3,
                        direction: 'top',
                        random: true,
                        straight: false,
                        out_mode: 'out'
                    }
                },
                retina_detect: true
            });

            setTimeout(() => {
                document.getElementById('proposal').classList.add('show');
            }, 1000);
        });

        const noBtn = document.getElementById('noBtn');
        let noClickCount = 0;

        noBtn.addEventListener('mouseover', function() {
            const x = Math.random() * (window.innerWidth - 200);
            const y = Math.random() * (window.innerHeight - 100);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        noBtn.addEventListener('click', function() {
            noClickCount++;
            if (noClickCount >= 1) {
                const popup = document.getElementById('popup');
                popup.classList.add('show');
                
                setTimeout(() => {
                    popup.classList.remove('show');
                    triggerYes();
                }, 2000);
            }
        });

        document.getElementById('yesBtn').addEventListener('click', triggerYes);

        function triggerYes() {
            createFireworks();
            
            confetti({
                particleCount: 200,
                spread: 180,
                origin: { y: 0.6 },
                colors: ['#ff0844', '#ff6b9d', '#ffffff', '#ffb6c1']
            });

            particlesJS('particles-js', {
                particles: {
                    number: { value: 200, density: { enable: true, value_area: 600 } },
                    color: { value: '#ffffff' },
                    shape: { type: 'heart' },
                    opacity: { value: 0.9, random: true },
                    size: { value: 20, random: true },
                    line_linked: { enable: false },
                    move: {
                        enable: true,
                        speed: 5,
                        direction: 'none',
                        random: true,
                        straight: false,
                        out_mode: 'out'
                    }
                },
                retina_detect: true
            });

            document.getElementById('proposal').style.display = 'none';
            document.getElementById('finalMessage').classList.add('show');
        }
    </script>
</body>
</html>
