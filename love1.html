<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rupali ❤️</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  overflow-x:hidden;
  background: linear-gradient(-45deg,#ff0033,#ff3366,#ff004c,#cc0033);
  background-size:400% 400%;
  animation: gradientMove 8s ease infinite;
  color:#fff;
  text-align:center;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

h1{
  font-size:3rem;
  font-weight:800;
  text-shadow:0 0 20px rgba(255,255,255,0.8);
  animation: glow 2s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px #fff,0 0 20px #ff99aa;}
  to{ text-shadow:0 0 20px #fff,0 0 40px #ff3366;}
}

.section{
  margin-top:30px;
  max-width:500px;
}

button{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:30px;
  font-size:1rem;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

.love-btn{
  background:#fff;
  color:#ff0033;
  box-shadow:0 0 15px rgba(255,255,255,0.8);
}

.love-btn:hover{
  transform:scale(1.1);
}

.hidden{
  display:none;
}

/* Floating Hearts */
.heart{
  position:fixed;
  bottom:-20px;
  color:#fff;
  animation: floatUp 6s linear infinite;
  font-size:20px;
  opacity:0.8;
}

@keyframes floatUp{
  0%{
    transform:translateY(0) translateX(0);
    opacity:0;
  }
  50%{opacity:1;}
  100%{
    transform:translateY(-100vh) translateX(50px);
    opacity:0;
  }
}
</style>
</head>

<body>

<h1>Rupali ❤️</h1>

<div class="section" id="loveLines"></div>

<div class="section hidden" id="poemSection">
  <p id="poemText"></p>
</div>

<div class="section hidden" id="interactionSection">
  <button class="love-btn" id="loveClick">Click here if you love me ❤️</button>
</div>

<!-- Audio -->
<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9c0d92.mp3?filename=romantic-love-11718.mp3" type="audio/mpeg">
</audio>

<script>
/* ---------------- FLOATING HEARTS AUTO GENERATOR ---------------- */

function createHeart(){
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 15) + "px";
  heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
  document.body.appendChild(heart);

  setTimeout(()=>{
    heart.remove();
  },6000);
}

setInterval(createHeart, 400);


/* ---------------- TYPEWRITER LOVE LINES ---------------- */

const loveLines = [
  "Main tumse prem karta hoon ❤️",
  "I love you ❤️",
  "Je t’aime ❤️",
  "Te amo ❤️",
  "Ich liebe dich ❤️",
  "Wo ai ni ❤️",
  "Watashi wa anata o aishiteimasu ❤️"
];

const loveContainer = document.getElementById("loveLines");
let lineIndex = 0;
let charIndex = 0;

function typeWriter(){
  if(lineIndex < loveLines.length){
    if(charIndex < loveLines[lineIndex].length){
      loveContainer.innerHTML += loveLines[lineIndex].charAt(charIndex);
      charIndex++;
      setTimeout(typeWriter, 50);
    }else{
      loveContainer.innerHTML += "<br><br>";
      lineIndex++;
      charIndex = 0;
      setTimeout(typeWriter, 600);
    }
  }else{
    setTimeout(showPoem, 1000);
  }
}

typeWriter();


/* ---------------- POEM REVEAL ---------------- */

function showPoem(){
  const poemSection = document.getElementById("poemSection");
  const poemText = document.getElementById("poemText");

  poemSection.classList.remove("hidden");

  const poemLines = [
    "Shaadi abhi nahi hui 💍",
    "Par dil se tum meri wife ho 💖",
    "Tum meri zindagi ho 😘",
    "Aur meri har smile ki wajah bhi 😍"
  ];

  let pIndex = 0;

  function showNextLine(){
    if(pIndex < poemLines.length){
      poemText.innerHTML += poemLines[pIndex] + "<br><br>";
      pIndex++;
      setTimeout(showNextLine, 800);
    }else{
      setTimeout(()=>{
        document.getElementById("interactionSection").classList.remove("hidden");
      },1000);
    }
  }

  showNextLine();
}
/* ---------------- LOAD CONFETTI LIBRARY ---------------- */
const confettiScript = document.createElement("script");
confettiScript.src = "https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js";
document.head.appendChild(confettiScript);


/* ---------------- LOVE BUTTON CLICK ---------------- */

const loveBtn = document.getElementById("loveClick");
const music = document.getElementById("bgMusic");

loveBtn.addEventListener("click", () => {

  music.play();

  // Confetti burst
  confetti({
    particleCount: 200,
    spread: 100,
    origin: { y: 0.6 }
  });

  // Extra hearts burst
  for(let i=0;i<30;i++){
    setTimeout(createHeart, i*100);
  }

  showProposal();
});


/* ---------------- PROPOSAL SECTION ---------------- */

function showProposal(){

  const proposalDiv = document.createElement("div");
  proposalDiv.id = "proposalBox";
  proposalDiv.style.marginTop = "30px";
  proposalDiv.innerHTML = `
    <h2 style="margin-bottom:20px;">Do you want to marry me? 💍</h2>
    <button id="yesBtn" style="background:#fff;color:#ff0033;margin-right:10px;">YES 💖</button>
    <button id="noBtn" style="background:#000;color:#fff;">NO 🙈</button>
  `;

  document.body.appendChild(proposalDiv);

  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");

  // NO button runs away
  noBtn.addEventListener("mouseover", ()=>{
    noBtn.style.position="absolute";
    noBtn.style.top=Math.random()*80+"vh";
    noBtn.style.left=Math.random()*80+"vw";
  });

  noBtn.addEventListener("click", ()=>{
    alert("Ladki ki 'No' me bhi 'Yes' hota hai 😌💖");
    celebrateYes();
  });

  yesBtn.addEventListener("click", celebrateYes);
}


/* ---------------- FINAL CELEBRATION ---------------- */

function celebrateYes(){

  document.body.innerHTML = `
    <h1 style="margin-top:40vh;">
      Yayyyy!!! 💍💖 <br><br>
      Rupali officially meri forever Valentine ho 💕
    </h1>
  `;

  // Massive Confetti
  const duration = 3 * 1000;
  const end = Date.now() + duration;

  (function frame() {
    confetti({
      particleCount: 5,
      angle: 60,
      spread: 55,
      origin: { x: 0 }
    });
    confetti({
      particleCount: 5,
      angle: 120,
      spread: 55,
      origin: { x: 1 }
    });

    if (Date.now() < end) {
      requestAnimationFrame(frame);
    }
  }());
}
</script>

</body>
</html>
