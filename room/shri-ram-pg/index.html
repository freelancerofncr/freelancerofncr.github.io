<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PG Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===== BASIC STYLES ===== -->
  <style>
    :root{
      --primary:#2563eb;
      --accent:#22c55e;
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }

    body{
      background:var(--bg);
      color:var(--text);
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:16px;
    }

    .card{
      background:var(--card);
      border-radius:18px;
      padding:18px;
      margin-bottom:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.06);
      animation:fadeUp .6s ease both;
    }

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(20px)}
      to{opacity:1;transform:translateY(0)}
    }

    /* ===== HEADER ===== */
    .header{
      text-align:center;
    }

    .logo{
      width:110px;
      height:110px;
      object-fit:contain;
      margin-bottom:8px;
    }

    .badge{
      display:inline-block;
      margin-top:6px;
      padding:6px 14px;
      border-radius:999px;
      background:#e0e7ff;
      color:#1e40af;
      font-size:14px;
      font-weight:600;
    }

    /* ===== BUTTONS ===== */
    .btn-row{
      display:flex;
      gap:12px;
      margin-top:14px;
    }

    .btn{
      flex:1;
      padding:14px;
      text-align:center;
      border-radius:14px;
      font-weight:700;
      text-decoration:none;
      color:#fff;
      position:relative;
      overflow:hidden;
    }

    .btn::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);
      transform:translateX(-100%);
      animation:shine 2.5s infinite;
    }

    @keyframes shine{
      to{transform:translateX(100%)}
    }

    .call{background:var(--primary)}
    .whatsapp{background:#25d366}

    /* ===== ROOMS ===== */
    .room{
      border:1px solid #e5e7eb;
      border-radius:14px;
      padding:14px;
      margin-bottom:14px;
    }

    .price{
      color:var(--accent);
      font-weight:800;
      margin:6px 0;
    }

    .facility-list{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:8px;
      font-size:14px;
    }

    .facility-list span{
      background:#f1f5f9;
      padding:6px 10px;
      border-radius:999px;
    }

    .photos{
      display:flex;
      gap:10px;
      overflow-x:auto;
      margin-top:10px;
    }

    .photos img{
      height:140px;
      border-radius:12px;
      object-fit:cover;
    }

    /* ===== LIST ===== */
    .pill-list{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .pill-list span{
      background:#ecfeff;
      color:#155e75;
      padding:8px 14px;
      border-radius:999px;
      font-size:14px;
      font-weight:600;
    }

    /* ===== QR ===== */
    .qr-box{
      text-align:center;
    }

    .qr-box img{
      width:200px;
      height:200px;
      object-fit:contain;
      margin-top:10px;
    }

    .muted{
      color:var(--muted);
      font-size:15px;
      margin-top:6px;
    }
  </style>
</head>

<body>
<div class="container">

  <!-- HEADER -->
  <div class="card header" id="headerCard">
    <img id="logo" class="logo" style="display:none">
    <h1 id="pgName"></h1>
    <p class="muted" id="description"></p>
    <div id="genderBadge"></div>

    <div class="btn-row">
      <a id="callBtn" class="btn call">Call</a>
      <a id="whatsappBtn" class="btn whatsapp">WhatsApp</a>
    </div>
  </div>

  <!-- ROOMS -->
  <div class="card" id="roomsCard">
    <h2>Available Rooms</h2>
    <div id="roomsContainer"></div>
  </div>

  <!-- FOOD -->
  <div class="card" id="foodCard">
    <h2>Food</h2>
    <p id="foodText"></p>
  </div>

  <!-- COMMON FACILITIES -->
  <div class="card" id="facilitiesCard">
    <h2>Common Facilities</h2>
    <div class="pill-list" id="facilityList"></div>
  </div>

  <!-- RULES -->
  <div class="card" id="rulesCard">
    <h2>Rules</h2>
    <ul id="rulesList"></ul>
  </div>

  <!-- PAYMENT -->
  <div class="card qr-box" id="paymentCard">
    <h2 id="paymentLabel"></h2>
    <img id="paymentQR">
  </div>

</div>

<!-- JSON5 CDN -->
<script src="https://unpkg.com/json5@2/dist/index.min.js"></script>
<script src="app.js"></script>
</body>
</html>
