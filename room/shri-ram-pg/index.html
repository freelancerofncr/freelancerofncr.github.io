<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<!-- ======================================================
 BASIC SEO (DYNAMIC VIA JSON5)
====================================================== -->
<title id="seo-title">PG / Room Details</title>
<meta name="description" id="seo-desc" content="PG and Room rental details" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- FAVICON -->
<link rel="icon" href="/assets/images/favicon.png" />

<!-- JSON5 (REQUIRED) -->
<script src="https://unpkg.com/json5@2/dist/index.min.js"></script>

<!-- ======================================================
 GLOBAL STYLES
====================================================== -->
<style>
:root{
  --bg-1:#0f172a;
  --bg-2:#020617;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#020617;
  --muted:#64748b;

  --primary:#1a73e8; /* Google Blue */
  --success:#16a34a;
  --whatsapp:#25d366;

  --radius-xl:22px;
  --radius-lg:16px;
  --radius-md:12px;

  --shadow-lg:0 25px 50px rgba(0,0,0,.12);
  --shadow-md:0 10px 30px rgba(0,0,0,.08);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial;
}

html,body{
  min-height:100%;
}

body{
  color:var(--text);
  background:#020617;
  overflow-x:hidden;
}

/* ======================================================
 ANIMATED BACKGROUND (PROFESSIONAL)
====================================================== */
.bg-wrap{
  position:fixed;
  inset:0;
  z-index:-1;
  overflow:hidden;
}

.blob{
  position:absolute;
  width:520px;
  height:520px;
  border-radius:50%;
  filter:blur(80px);
  opacity:.45;
  animation:float 22s infinite alternate ease-in-out;
}

.blob.blue{
  background:#1a73e8;
  top:-120px;
  left:-120px;
}

.blob.purple{
  background:#7c3aed;
  bottom:-160px;
  right:-160px;
  animation-duration:26s;
}

.blob.green{
  background:#16a34a;
  top:40%;
  left:60%;
  animation-duration:30s;
}

@keyframes float{
  from{transform:translateY(0) translateX(0)}
  to{transform:translateY(-80px) translateX(60px)}
}

/* noise overlay */
.bg-wrap::after{
  content:"";
  position:absolute;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
  pointer-events:none;
}

/* ======================================================
 LAYOUT
====================================================== */
.page{
  max-width:960px;
  margin:auto;
  padding:18px;
}

.card{
  background:var(--card);
  border-radius:var(--radius-xl);
  padding:22px;
  margin-bottom:18px;
  border:1px solid var(--border);
  box-shadow:var(--shadow-md);
}

/* ======================================================
 HEADER / HERO
====================================================== */
.hero{
  text-align:center;
}

.logo{
  width:120px;
  height:120px;
  object-fit:contain;
  border-radius:16px;
  border:3px solid #fff;
  box-shadow:var(--shadow-lg);
  background:#fff;
  margin:auto;
  display:none;
}

.pg-name{
  font-size:28px;
  font-weight:800;
  margin-top:14px;
}

.pg-desc{
  color:var(--muted);
  font-size:15px;
  margin-top:6px;
  line-height:1.5;
}

/* ======================================================
 GENDER BADGE
====================================================== */
.gender-badge{
  display:inline-block;
  margin-top:12px;
  padding:6px 16px;
  border-radius:999px;
  font-weight:700;
  font-size:14px;
}

.gender-boys{background:#e0f2fe;color:#075985}
.gender-girls{background:#fce7f3;color:#9d174d}
.gender-both{background:#ede9fe;color:#5b21b6}

/* ======================================================
 ACTION BUTTONS
====================================================== */
.actions{
  margin-top:20px;
  display:grid;
  gap:12px;
}

.actions.two{
  grid-template-columns:1fr 1fr;
}

.actions.one{
  grid-template-columns:1fr;
}

.action-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:14px;
  border-radius:var(--radius-lg);
  font-weight:700;
  text-decoration:none;
  border:2px solid transparent;
}

.action-btn img{
  width:20px;
  height:20px;
}

.call-btn{
  background:var(--primary);
  color:#fff;
}

.whatsapp-btn{
  background:var(--whatsapp);
  color:#fff;
}

.map-btn{
  background:#fff;
  color:#000;
  border-color:var(--primary);
}
</style>
</head>

<div class="bg-wrap">

</div>

====================================================== -->
