<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Property Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#2563eb;
  --pink:#ec4899;
  --green:#16a34a;
  --orange:#f97316;
  --dark:#111827;
  --muted:#6b7280;
  --card:#ffffff;
}

/* RESET */
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
}

body{
  min-height:100vh;
  color:var(--dark);
  background:
    radial-gradient(circle at 10% 10%, #e0e7ff, transparent 40%),
    radial-gradient(circle at 90% 20%, #dcfce7, transparent 45%),
    radial-gradient(circle at 50% 90%, #ffe4e6, transparent 40%),
    #f8fafc;
  animation:bgMove 18s linear infinite alternate;
}

@keyframes bgMove{
  0%{background-position:0% 0%,100% 0%,50% 100%}
  100%{background-position:10% 20%,90% 10%,40% 90%}
}

.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  border:1px solid #e5e7eb;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

h1{font-size:26px;margin-top:10px}
h2{font-size:22px;margin-bottom:12px}
h3{font-size:18px;margin-bottom:8px}
.muted{color:var(--muted);font-size:14px}

/* HEADER */
.header{text-align:center}

.logo{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:contain;
  border:4px solid #fff;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
  display:none;
  margin:auto;
}

/* GENDER */
.gender{
  display:inline-block;
  margin-top:10px;
  padding:6px 16px;
  border-radius:999px;
  font-weight:700;
  font-size:14px;
}
.gender.boys{background:#e0f2fe;color:#0369a1}
.gender.girls{background:#fce7f3;color:#9d174d}
.gender.both{background:#ede9fe;color:#5b21b6}

/* ACTION BUTTONS */
.actions{margin-top:18px}
.action-row{
  display:grid;
  gap:12px;
}
.action-row.two{grid-template-columns:1fr 1fr}
.action-row.one{grid-template-columns:1fr;margin-top:12px}

.action-btn{
  position:relative;
  padding:14px 10px;
  border-radius:16px;
  font-weight:700;
  color:#fff;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  overflow:hidden;
}

.action-btn img{width:20px;height:20px}

.action-btn::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.45),
    transparent
  );
  transform:translateX(-100%);
  animation:shine 3s infinite;
}

@keyframes shine{
  to{transform:translateX(100%)}
}

.call{background:var(--blue)}
.whatsapp{background:#25d366}
.map{background:var(--orange)}

/* PILLS */
.pill-list{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.pill{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:999px;
  background:#f1f5f9;
  font-size:14px;
  font-weight:600;
}

.pill img{width:18px;height:18px}

/* ROOMS */
.room{
  border:2px solid #e5e7eb;
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
}

.room .price{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:700;
  margin-bottom:8px;
}

.photos{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:6px;
}

.photos img{
  height:140px;
  border-radius:12px;
}

.swipe{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
  color:var(--muted);
  margin-top:6px;
}
</style>
</head>

<body>
<div class="container">

<!-- HEADER -->
<section class="card header">
  <img id="logo" class="logo" alt="Logo">
  <h1 id="pgName"></h1>
  <p id="description" class="muted"></p>
  <div id="genderBadge"></div>

  <div class="actions">
    <div class="action-row two">
      <a id="callBtn" class="action-btn call">
        <img src="/assets/icons/black-icons/call.svg">Call
      </a>
      <a id="whatsappBtn" class="action-btn whatsapp">
        <img src="/assets/icons/color-icons/whatsapp.svg">WhatsApp
      </a>
    </div>
    <div class="action-row one">
      <a id="mapBtn" class="action-btn map">
        <img src="/assets/icons/color-icons/google-map.svg">Location
      </a>
    </div>
  </div>
</section>

<!-- SUITABLE -->
<section class="card" id="suitableForCard">
  <h2>Suitable For</h2>
  <div class="pill-list" id="suitableForList"></div>
</section>

<!-- CONTACT -->
<section class="card" id="contactDetailsCard">
  <h2>Contact</h2>
  <div class="pill-list" id="contactNumbers"></div>
  <p id="addressText" class="muted" style="margin-top:12px;display:flex;gap:8px"></p>
</section>

<!-- SOCIAL -->
<section class="card" id="socialCard">
  <h2>Connect</h2>
  <div class="pill-list" id="socialLinks"></div>
</section>

<!-- PROPERTY INFO -->
<section class="card" id="propertyInfoCard">
  <h2>Property Info</h2>
  <div class="pill-list">
    <div class="pill" id="propertyType">
      <img src="/assets/icons/black-icons/shop.svg"><span></span>
    </div>
    <div class="pill" id="totalFloors">
      <img src="/assets/icons/black-icons/chart-arrow-up.svg"><span></span>
    </div>
    <div class="pill" id="liftInfo">
      <img src="/assets/icons/black-icons/lift.svg"><span></span>
    </div>
  </div>
</section>

<!-- ROOMS -->
<section class="card" id="roomsCard">
  <h2>Rooms & Pricing</h2>
  <div id="roomsContainer"></div>
</section>

<!-- CHARGES -->
<section class="card" id="chargesCard">
  <h2>Charges</h2>
  <div class="pill-list">
    <div class="pill" id="electricityCharge">
      <img src="/assets/icons/color-icons/lightning.svg"><span></span>
    </div>
    <div class="pill" id="waterCharge">
      <img src="/assets/icons/black-icons/ro-water.svg"><span></span>
    </div>
    <div class="pill" id="maintenanceCharge">
      <img src="/assets/icons/black-icons/quality-badge-checkmark.svg"><span></span>
    </div>
  </div>
</section>

<!-- PAYMENT -->
<section class="card" id="paymentCard">
  <h2 id="paymentLabel"></h2>
  <img id="paymentQR" style="width:220px;display:block;margin:auto">
  <div class="pill-list" style="justify-content:center;margin-top:14px">
    <span class="pill"><img src="/assets/icons/color-icons/google-pay.svg">Google Pay</span>
    <span class="pill"><img src="/assets/icons/color-icons/phonepe.svg">PhonePe</span>
    <span class="pill"><img src="/assets/icons/color-icons/paytm.svg">Paytm</span>
    <span class="pill"><img src="/assets/icons/color-icons/bhim-app.svg">BHIM</span>
    <span class="pill"><img src="/assets/icons/color-icons/upi.svg">UPI</span>
  </div>
</section>

</div>

<script src="app.js"></script>
</body>
</html>
