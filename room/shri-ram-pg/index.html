<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<!-- ======================================================
 BASIC SEO (DYNAMIC VIA JSON5)
====================================================== -->
<title id="seo-title">PG / Room Details</title>
<meta name="description" id="seo-desc" content="PG and Room rental details" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- FAVICON -->
<link rel="icon" href="/assets/images/favicon.png" />

<!-- JSON5 (REQUIRED) -->
<script src="https://unpkg.com/json5@2/dist/index.min.js"></script>

<!-- ======================================================
 GLOBAL STYLES
====================================================== -->
<style>
:root{
  --bg-primary:#f8fafc;
  --bg-secondary:#ffffff;
  --card:#ffffff;
  --border:#e2e8f0;
  --text:#0f172a;
  --text-muted:#64748b;
  --text-light:#94a3b8;

  --primary:#1a73e8;
  --primary-hover:#1557b0;
  --success:#16a34a;
  --whatsapp:#25d366;
  --whatsapp-hover:#1fa855;

  --radius-xl:20px;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:8px;

  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
}

html,body{
  min-height:100%;
}

body{
  color:var(--text);
  background:var(--bg-primary);
  overflow-x:hidden;
  line-height:1.6;
}

/* ======================================================
 ANIMATED BACKGROUND (LIGHT & PROFESSIONAL)
====================================================== */
.bg-wrap{
  position:fixed;
  inset:0;
  z-index:-1;
  overflow:hidden;
  background:linear-gradient(135deg,#f0f9ff 0%,#f8fafc 50%,#fef3c7 100%);
}

.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(100px);
  opacity:.3;
  animation:float 25s infinite alternate ease-in-out;
}

.blob.blue{
  background:linear-gradient(135deg,#dbeafe,#bfdbfe);
  width:600px;
  height:600px;
  top:-200px;
  left:-150px;
}

.blob.purple{
  background:linear-gradient(135deg,#e9d5ff,#ddd6fe);
  width:500px;
  height:500px;
  bottom:-150px;
  right:-100px;
  animation-duration:30s;
}

.blob.green{
  background:linear-gradient(135deg,#d1fae5,#a7f3d0);
  width:450px;
  height:450px;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  animation-duration:35s;
}

@keyframes float{
  from{transform:translateY(0) translateX(0)}
  to{transform:translateY(-60px) translateX(50px)}
}

/* subtle pattern overlay */
.bg-wrap::after{
  content:"";
  position:absolute;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23cbd5e1' fill-opacity='0.05'%3E%3Cpath d='M30 30l15-15m-15 15l-15 15m15-15l15 15m-15-15l-15-15'/%3E%3C/g%3E%3C/svg%3E");
  pointer-events:none;
}

/* ======================================================
 LAYOUT
====================================================== */
.page{
  max-width:1000px;
  margin:auto;
  padding:24px 16px;
}

.card{
  background:var(--card);
  border-radius:var(--radius-xl);
  padding:28px 24px;
  margin-bottom:20px;
  border:1px solid var(--border);
  box-shadow:var(--shadow-md);
  transition:box-shadow .3s ease;
}

.card:hover{
  box-shadow:var(--shadow-lg);
}

/* ======================================================
 HEADER / HERO
====================================================== */
.hero{
  text-align:center;
  padding:32px 24px;
}

.logo{
  width:110px;
  height:110px;
  object-fit:contain;
  border-radius:var(--radius-lg);
  border:3px solid #fff;
  box-shadow:var(--shadow-lg);
  background:#fff;
  margin:auto;
  display:block;
  opacity:0;
  transition:opacity 0.3s ease;
}

.logo.loaded{
  opacity:1;
}

.pg-name{
  font-size:32px;
  font-weight:800;
  margin-top:16px;
  color:var(--text);
  letter-spacing:-0.5px;
}

.pg-desc{
  color:var(--text-muted);
  font-size:16px;
  margin-top:10px;
  line-height:1.6;
  max-width:600px;
  margin-left:auto;
  margin-right:auto;
}

/* ======================================================
 GENDER BADGE
====================================================== -->
.gender-badge{
  display:inline-block;
  margin-top:24px;
  padding:16px 40px;
  border-radius:50px;
  font-weight:900;
  font-size:17px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  border:4px solid;
  position:relative;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  animation:badgePulse 2.5s ease-in-out infinite;
}

@keyframes badgePulse{
  0%,100%{
    transform:scale(1);
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  50%{
    transform:scale(1.05);
    box-shadow:0 15px 40px rgba(0,0,0,.35);
  }
}

.gender-badge::before{
  content:"";
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:linear-gradient(45deg,transparent,rgba(255,255,255,.4),transparent);
  animation:badgeShine 3s linear infinite;
}

@keyframes badgeShine{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}

.gender-boys{
  background:linear-gradient(135deg,#2563eb,#3b82f6,#60a5fa);
  color:#ffffff;
  border-color:#1e40af;
  text-shadow:0 2px 4px rgba(0,0,0,.3);
}

.gender-boys::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50px;
  background:linear-gradient(135deg,rgba(59,130,246,.3),transparent);
  box-shadow:inset 0 0 30px rgba(59,130,246,.5),0 0 40px rgba(59,130,246,.4);
}

.gender-girls{
  background:linear-gradient(135deg,#db2777,#ec4899,#f472b6);
  color:#ffffff;
  border-color:#9f1239;
  text-shadow:0 2px 4px rgba(0,0,0,.3);
}

.gender-girls::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50px;
  background:linear-gradient(135deg,rgba(236,72,153,.3),transparent);
  box-shadow:inset 0 0 30px rgba(236,72,153,.5),0 0 40px rgba(236,72,153,.4);
}

.gender-both{
  background:linear-gradient(135deg,#7c3aed,#8b5cf6,#a78bfa);
  color:#ffffff;
  border-color:#5b21b6;
  text-shadow:0 2px 4px rgba(0,0,0,.3);
}

.gender-both::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50px;
  background:linear-gradient(135deg,rgba(139,92,246,.3),transparent);
  box-shadow:inset 0 0 30px rgba(139,92,246,.5),0 0 40px rgba(139,92,246,.4);
}

/* ======================================================
 ACTION BUTTONS
====================================================== */
.actions{
  margin-top:24px;
  display:grid;
  gap:12px;
}

.actions.two{
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.actions.one{
  grid-template-columns:1fr;
  margin-top:12px;
}

.action-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:16px 24px;
  border-radius:var(--radius-lg);
  font-weight:700;
  font-size:15px;
  text-decoration:none;
  border:2px solid transparent;
  transition:all .25s ease;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  background-size:200% auto;
}

 .action-btn::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  width:0;
  height:0;
  border-radius:50%;
  background:rgba(255,255,255,.3);
  transform:translate(-50%,-50%);
  transition:width .6s ease,height .6s ease;
}

.action-btn:active::before{
  width:300px;
  height:300px;
}

.action-btn img{
  width:22px;
  height:22px;
}

.call-btn{
  background:linear-gradient(90deg,var(--primary),#60a5fa,var(--primary));
  background-size:200% auto;
  color:#fff;
  box-shadow:0 4px 14px rgba(26,115,232,.3);
  animation:shine 3s linear infinite;
}

.call-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(26,115,232,.5);
}

.whatsapp-btn{
  background:linear-gradient(90deg,var(--whatsapp),#4ade80,var(--whatsapp));
  background-size:200% auto;
  color:#fff;
  box-shadow:0 4px 14px rgba(37,211,102,.3);
  animation:shine 3s linear infinite;
}

.whatsapp-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(37,211,102,.5);
}

.map-btn{
  background:#fff;
  color:var(--text);
  border:3px solid #3b82f6;
  border-radius:14px;
  box-shadow:var(--shadow-sm),0 0 25px rgba(59,130,246,.4);
  position:relative;
  animation:borderGlow 2s ease-in-out infinite;
}

@keyframes borderGlow{
  0%,100%{
    border-color:#3b82f6;
    box-shadow:var(--shadow-sm),0 0 25px rgba(59,130,246,.4);
  }
  50%{
    border-color:#60a5fa;
    box-shadow:var(--shadow-md),0 0 35px rgba(59,130,246,.6);
  }
}

.map-btn:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-md),0 0 40px rgba(59,130,246,.7);
}

/* ======================================================
 SECTION TITLE
====================================================== */
.section-title{
  font-size:24px;
  font-weight:800;
  text-align:center;
  margin-bottom:24px;
  color:var(--text);
  position:relative;
  letter-spacing:-0.3px;
  display:block;
}

.section-title::after{
  content:"";
  display:block;
  width:60px;
  height:4px;
  background:linear-gradient(to right,var(--primary),#7c3aed);
  margin:10px auto 0;
  border-radius:4px;
}

/* ======================================================
 PILLS & LISTS
====================================================== */
.pill-list{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}

.pill{
  display:inline-block;
  padding:6px 14px;
  border-radius:999px;
  background:#f1f5f9;
  font-size:13px;
  font-weight:600;
  color:var(--text);
  border:1px solid var(--border);
  transition:all .2s ease;
}

 /* Contact numbers - inline compact style */
#contactNumbers .pill{
  padding:6px 12px;
  font-size:13px;
  background:#fff;
  border:1px solid var(--border);
}

#contactNumbers .pill img{
  width:16px;
  height:16px;
}

.pill img{
  display:none;
}

.pill:hover{
  background:#e2e8f0;
  transform:translateY(-1px);
}

/* Social Links - special styling */
#socialLinks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  max-width:500px;
  margin:auto;
}

#socialLinks .pill{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:#fff;
  border:2px solid var(--border);
  text-decoration:none;
  color:var(--text);
  font-weight:600;
  padding:12px 16px;
  transition:all .3s ease;
}

#socialLinks .pill img{
  display:block;
  width:20px;
  height:20px;
}

#socialLinks .pill:hover{
  box-shadow:var(--shadow-md);
  transform:translateY(-3px);
  border-color:var(--primary);
  background:#f8fafc;
}
/* ======================================================
 CONTACT & ADDRESS
====================================================== */
.address{
  margin-top:4px;
  display:flex;
  gap:8px;
  align-items:center;
  font-size:14px;
  color:var(--text-muted);
  padding:0;
  background:transparent;
  text-align:left;
}

#contactCard{
  text-align:left;
}

#contactNumbers{
  text-align:left;
}
 
.contact-row{
  display:flex;
  gap:8px;
  align-items:center;
  font-size:14px;
  color:var(--text);
  font-weight:500;
  margin-bottom:10px;
  text-align:left;
}

.contact-row img{
  width:18px;
  height:18px;
  flex-shrink:0;
}
 
.address img{
  width:18px;
  flex-shrink:0;
}

/* ======================================================
 PROPERTY INFO
====================================================== */
.info-grid{
  text-align:center;
  font-size:15px;
  font-weight:600;
  color:var(--text-muted);
  line-height:1.8;
}

.info-pill{
  display:none;
}

.info-pill img{
  width:24px;
  height:24px;
}

/* ======================================================
 COMMON FACILITIES GRID
====================================================== */
.facilities-grid{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
}

.facility-item{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  border-radius:999px;
  background:#f1f5f9;
  font-weight:600;
  font-size:13px;
  color:var(--text);
  border:1px solid var(--border);
  transition:all .2s ease;
}

.facility-item:hover{
  background:#e2e8f0;
  transform:translateY(-1px);
}

.facility-item img{
  display:block;
  width:18px;
  height:18px;
}

/* ======================================================
 FOOD DETAILS
====================================================== */
.food-wrap{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.food-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-radius:var(--radius-md);
  background:#f8fafc;
  font-weight:600;
  font-size:14px;
  border:1px solid var(--border);
}

.food-row img{
  width:24px;
  height:24px;
}

.food-row.highlight{
  background:linear-gradient(135deg,#ecfdf5,#d1fae5);
  border-color:#86efac;
}

/* ======================================================
 ROOMS & PRICING
====================================================== */
.room-card{
  border:2px solid var(--border);
  border-radius:var(--radius-lg);
  padding:20px;
  margin-bottom:20px;
  background:#fff;
  transition:all .3s ease;
}

.room-card:hover{
  border-color:var(--primary);
  box-shadow:var(--shadow-lg);
  transform:translateY(-2px);
}

.room-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}

.room-title{
  font-size:20px;
  font-weight:800;
  color:var(--text);
  margin-bottom:6px;
}

.room-rent{
  font-size:24px;
  font-weight:900;
  color:#16a34a;
  margin-bottom:14px;
  letter-spacing:-0.5px;
}

.room-price{
  display:none;
}

.room-price img{
  width:20px;
}

.room-features{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}

.room-facility{
  display:inline-block;
  font-size:13px;
  padding:7px 14px;
  border-radius:6px;
  background:#ffffff;
  font-weight:600;
  border:1.5px solid #cbd5e1;
  color:var(--text);
  transition:all .2s ease;
}

.room-facility:hover{
  border-color:var(--primary);
  background:#f8fafc;
}
 
/* ROOM PHOTOS */
.room-photos{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:8px;
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}

.room-photos::-webkit-scrollbar{
  height:6px;
}

.room-photos::-webkit-scrollbar-track{
  background:transparent;
}

.room-photos::-webkit-scrollbar-thumb{
  background:var(--border);
  border-radius:999px;
}

.room-photos img{
  height:160px;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:var(--radius-md);
  border:2px solid var(--border);
  transition:all .2s ease;
  cursor:pointer;
}

.room-photos img:hover{
  border-color:var(--primary);
  transform:scale(1.05);
}

/* ======================================================
 CHARGES
====================================================== */
.charges-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

.charge-pill{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
  border-radius:var(--radius-md);
  background:#f8fafc;
  font-weight:600;
  font-size:15px;
  border:1px solid var(--border);
  transition:all .2s ease;
}

.charge-pill:hover{
  background:#f1f5f9;
  transform:translateY(-2px);
}

.charge-pill img{
  width:20px;
  height:20px;
}

/* ======================================================
 RULES / POLICIES
====================================================== */
.rules-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.rule-item{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:14px;
  border-radius:var(--radius-md);
  background:#fef3c7;
  border:1px solid #fde68a;
  font-size:14px;
  font-weight:600;
  color:#78350f;
}

.rule-item img{
  width:20px;
  margin-top:2px;
  flex-shrink:0;
}

/* ======================================================
 PAYMENT
====================================================== */
.payment-wrap{
  text-align:center;
}

#paymentQR{
  width:240px;
  aspect-ratio:1/1;
  object-fit:contain;
  border-radius:var(--radius-lg);
  border:2px solid var(--border);
  padding:16px;
  margin:20px auto;
  display:none;
  background:#fff;
  box-shadow:var(--shadow-md);
}

.upi-icons{
  display:flex;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
}

.upi-icons img{
  width:48px;
  height:48px;
  transition:transform .2s ease;
}

.upi-icons img:hover{
  transform:scale(1.1);
}

/* ======================================================
 FOOTER
====================================================== */
.footer{
  padding:32px 16px 48px;
  text-align:center;
  color:var(--text-muted);
}

.footer-inner{
  max-width:600px;
  margin:auto;
}

.footer-logo{
  width:50px;
  opacity:.8;
  margin-bottom:12px;
}

.footer p{
  font-size:14px;
  line-height:1.6;
}

.footer a{
  color:var(--primary);
  text-decoration:none;
  font-weight:600;
}

.footer a:hover{
  text-decoration:underline;
}

/* ======================================================
 RESPONSIVE
====================================================== */
@media(max-width:640px){
  .pg-name{font-size:26px}
  .pg-desc{font-size:15px}
  .section-title{font-size:20px}
  
  .info-grid{
    text-align:left;
  }
  
  .charges-grid{
    grid-template-columns:1fr;
  }
  
  .facilities-grid{
    justify-content:flex-start;
  }
  
  #socialLinks{
    grid-template-columns:1fr 1fr;
  }
}

.room-book-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  padding:14px;
  background:var(--whatsapp);
  color:#fff;
  text-decoration:none;
  border-radius:var(--radius-lg);
  font-weight:700;
  font-size:15px;
  border:none;
  box-shadow:0 4px 14px rgba(37,211,102,.3);
  transition:all .3s ease;
  margin-top:14px;
}

.room-book-btn img{
  width:22px;
  height:22px;
}

.room-book-btn:hover{
  background:var(--whatsapp-hover);
  box-shadow:0 8px 20px rgba(37,211,102,.4);
  transform:translateY(-2px);
}

.room-book-btn:active{
  transform:translateY(0);
}

/* ======================================================
 PAGE ANIMATIONS
====================================================== */
@keyframes fadeInUp{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

@keyframes shine{
  0%{background-position:200% center}
  100%{background-position:-200% center}
}

.card{
  animation:fadeInUp 0.6s ease-out backwards;
}

.card:nth-child(1){animation-delay:0.1s}
.card:nth-child(2){animation-delay:0.2s}
.card:nth-child(3){animation-delay:0.3s}
.card:nth-child(4){animation-delay:0.4s}
.card:nth-child(5){animation-delay:0.5s}
.card:nth-child(6){animation-delay:0.6s}
.card:nth-child(7){animation-delay:0.7s}
.card:nth-child(8){animation-delay:0.8s}
.card:nth-child(9){animation-delay:0.9s}
.card:nth-child(10){animation-delay:1s}

/*.logo{
  animation:float 3s ease-in-out infinite;
}*/
 
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg-wrap">
  <div class="blob blue"></div>
  <div class="blob purple"></div>
  <div class="blob green"></div>
</div>

<div class="page">

<!-- ======================================================
 HERO / HEADER CARD
====================================================== -->
<section class="card hero">

  <img id="logo" class="logo" alt="PG Logo" style="display:none;" />

  <h1 id="pgName" class="pg-name">PG / Room Name</h1>

  <p id="description" class="pg-desc"></p>

  <div id="genderBadge"></div>

  <div class="actions two">
    <a id="callBtn" class="action-btn call-btn">
